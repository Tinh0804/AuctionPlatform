name: auctionplatform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-/srv/auction/.env}
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-0}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx900m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    networks:
      - app
      - data
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1400m
    cpus: 1.25
    stop_grace_period: 45s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/auction/certbot/www:/var/www/certbot:ro
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

networks:
  edge:
    name: auctionplatform_edge
  app:
    name: auctionplatform_app
    internal: true
  data:
    name: auctionplatform_data
