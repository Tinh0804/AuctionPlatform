upstream auction_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name api.auctionplatform.tinhlelaptrinh.id.vn;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.auctionplatform.tinhlelaptrinh.id.vn;

    ssl_certificate /etc/letsencrypt/live/api.auctionplatform.tinhlelaptrinh.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.auctionplatform.tinhlelaptrinh.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        proxy_pass http://auction_backend/AuctionPlatform/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=auction_api burst=20 nodelay;
        limit_conn auction_conn 10;
        limit_req_status 429;

        proxy_pass http://auction_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
    }

    location ~* \.(php|env|htaccess|htpasswd|git|svn)$ {
        return 403;
    }

    location ~* /\.(env|git|svn) {
        return 403;
    }
}
