name: auctionplatform

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-auctiondb}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USERNAME:-root}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-auction_postgres_password}}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1100m
    cpus: 0.75
    shm_size: 128m
    stop_grace_period: 60s
    logging: *default-logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-auction_redis_secret}
    command:
      - sh
      - -ec
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 192mb
        --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 256m
    cpus: 0.25
    stop_grace_period: 30s
    logging: *default-logging

  backend:
    image: ${BACKEND_IMAGE:-${DOCKER_USERNAME:-tinh08042005}/auction-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - ${RUNTIME_ENV_FILE:-.env}
    environment:
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-${DB_NAME:-auctiondb}}
      DB_USERNAME: ${POSTGRES_USER:-${DB_USERNAME:-root}}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD}}
      REDIS_URL: redis://default:${REDIS_PASSWORD:-auction_redis_secret}@redis:6379
      REDIS_DATABASE: ${REDIS_DATABASE:-1}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-false}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-0}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms256m -Xmx900m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    expose:
      - "8080"
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1400m
    cpus: 1.25
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/AuctionPlatform/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:

networks:
  edge:
  app:
    internal: true
  data:
    internal: true
