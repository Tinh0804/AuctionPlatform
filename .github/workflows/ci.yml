name: CI Pipeline
run-name: ${{ github.actor }}

on:
  push:
    branches: ['main', 'master', 'infra/gcp-compose']
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'deploy/**'
      - '.github/workflows/**'
  pull_request:
    branches: ['main', 'master']
    paths:
      - 'Backend/**'
      - 'Frontend/**'
      - 'deploy/**'
      - '.github/workflows/**'

jobs:
  validate-deployment:
    name: Validate Deployment Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment shell syntax
        run: |
          bash -n \
            deploy/scripts/lib/common.sh \
            deploy/scripts/deploy.sh \
            deploy/scripts/rollback.sh \
            deploy/scripts/cleanup-backend-images.sh \
            deploy/tests/cleanup-backend-images-test.sh

      - name: Test backend image retention
        run: bash deploy/tests/cleanup-backend-images-test.sh

      - name: Validate production Compose configuration
        env:
          # Service env_file paths are resolved relative to compose.prod.yml.
          RUNTIME_ENV_FILE: .env.example
          DB_PASSWORD: compose-validation-only
        run: docker compose --env-file deploy/.env.example -f deploy/compose.prod.yml config --quiet

  build-backend:
    name: Build & Test Backend (Spring Boot)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend
        run: ./mvnw -B -ntp test-compile

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}/auction-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}/auction-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Test Frontend (React Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./Frontend/dist
          retention-days: 1
