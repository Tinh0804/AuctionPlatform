name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend tests and package verification
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deployment-config:
    name: Validate Compose and Nginx
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose
        env:
          APP_ENV_FILE: ${{ github.workspace }}/deploy/.env.example
        run: docker compose --env-file deploy/.env.example -f deploy/compose.prod.yml config --quiet

      - name: Validate Nginx configuration
        run: |
          certificate_dir="$RUNNER_TEMP/letsencrypt/live/api.auctionplatform.tinhlelaptrinh.id.vn"
          mkdir -p "$certificate_dir" "$RUNNER_TEMP/certbot"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$certificate_dir/privkey.pem" \
            -out "$certificate_dir/fullchain.pem" \
            -subj '/CN=api.auctionplatform.tinhlelaptrinh.id.vn' >/dev/null 2>&1
          docker run --rm \
            --add-host backend:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/conf.d/api.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            -v "$RUNNER_TEMP/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

      - name: Validate deployment scripts
        run: bash -n deploy/scripts/*.sh

  backend-image:
    name: Build and push backend image once
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, deployment-config]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push immutable backend image
        uses: docker/build-push-action@v6
        with:
          context: Backend
          file: Backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/auction-backend:${{ github.sha }}
          cache-from: type=gha,scope=auction-backend
          cache-to: type=gha,mode=max,scope=auction-backend
          provenance: true
