name: CD Pipeline
run-name: ${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed
    branches: ['main', 'master', 'infra/gcp-compose']

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend to GCP VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Copy deployment files to GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          source: "deploy/**"
          target: "/home/${{ secrets.GCP_VM_USER }}/auction"
          strip_components: 1
          overwrite: true

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "🚀 Start Deploying AuctionPlatform to Google Cloud VM"
            
            DEPLOY_DIR="/home/${{ secrets.GCP_VM_USER }}/auction"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            RELEASE_TAG="${{ github.event.workflow_run.head_sha }}"
            DOCKER_NAMESPACE="${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}"
            BACKEND_REPOSITORY="$DOCKER_NAMESPACE/auction-backend"

            # ENV_PROD là nguồn cấu hình chính. Nếu secret chưa được cấu hình,
            # giữ lại cấu hình hiện tại trên VM và chỉ cập nhật metadata release.
            if [ -n "${{ secrets.ENV_PROD || '' }}" ]; then
              printf '%s\n' "${{ secrets.ENV_PROD }}" > .env.release
            elif [ -f .env ]; then
              cp .env .env.release
            else
              echo "❌ Missing both GitHub ENV_PROD and the existing VM .env file" >&2
              exit 1
            fi

            # Loại bỏ release key cũ rồi ghi đúng một giá trị mới. File được
            # thay thế atomically để không tăng kích thước sau mỗi lần deploy.
            ENV_NEXT=$(mktemp "$DEPLOY_DIR/.env.next.XXXXXX")
            awk -F= '$1 != "IMAGE_TAG" && $1 != "DOCKER_USERNAME" && $1 != "BACKEND_IMAGE"' \
              .env.release > "$ENV_NEXT"
            printf 'IMAGE_TAG=%s\nDOCKER_USERNAME=%s\nBACKEND_IMAGE=%s\n' \
              "$RELEASE_TAG" "$DOCKER_NAMESPACE" "$BACKEND_REPOSITORY" >> "$ENV_NEXT"
            chmod 600 "$ENV_NEXT"
            mv "$ENV_NEXT" .env
            rm -f .env.release

            # Đăng nhập Docker Hub trên VM để hỗ trợ kéo image
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "$DOCKER_NAMESPACE" --password-stdin

            # deploy.sh thực hiện backup, health check, rollback và chỉ cleanup
            # backend images sau khi phiên bản mới đã vượt qua public health check.
            sudo env \
              DEPLOY_HOME="$DEPLOY_DIR" \
              APP_ENV_FILE="$DEPLOY_DIR/.env" \
              COMPOSE_FILE="$DEPLOY_DIR/compose.prod.yml" \
              BACKEND_REPOSITORY="$BACKEND_REPOSITORY" \
              bash "$DEPLOY_DIR/scripts/deploy.sh" "$RELEASE_TAG"
