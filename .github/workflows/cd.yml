name: CD Pipeline
run-name: ${{ github.actor }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - "CI Pipeline"
    types:
      - completed
    branches: ['main', 'master', 'infra/gcp-compose']

jobs:
  deploy-backend:
    name: 🚀 Deploy Backend to GCP VM
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 1

      - name: Copy deployment files to GCP VM
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          source: "deploy/**"
          target: "/home/${{ secrets.GCP_VM_USER }}/auction"
          strip_components: 1
          overwrite: true

      - name: Deploy to GCP VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: ${{ secrets.GCP_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "🚀 Start Deploying AuctionPlatform to Google Cloud VM"
            
            DEPLOY_DIR="/home/${{ secrets.GCP_VM_USER }}/auction"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            
            # Ghi mã định danh phiên bản code và Docker username vào .env
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" > .env.release
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}" >> .env.release
            
            # Nếu có cấu hình secret ENV_PROD trên GitHub thì ghi đè vào .env
            if [ -n "${{ secrets.ENV_PROD || '' }}" ]; then
              echo "${{ secrets.ENV_PROD }}" >> .env.release
            fi
            
            # Đảm bảo file .env tồn tại trên server nếu chưa có
            if [ -f .env.release ]; then
              cat .env.release >> .env 2>/dev/null || cp .env.release .env
            fi
            
            # Đăng nhập Docker Hub trên VM để hỗ trợ kéo image
            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME || vars.DOCKER_NAMESPACE }}" --password-stdin || true
            
            # Pull image backend mới nhất
            echo "📦 Pulling new image..."
            sudo docker compose -f compose.prod.yml pull backend || sudo docker compose -f compose.prod.yml pull backend
            
            # Khởi động toàn bộ các container (postgres, redis, backend, nginx)
            echo "🔄 Starting services..."
            sudo docker compose -f compose.prod.yml up -d
            
            # Kiểm tra trạng thái containers
            echo "🔍 Checking container status..."
            sudo docker compose -f compose.prod.yml ps
            
            # Dọn dẹp images cũ
            echo "🧹 Cleaning up old unused images..."
            sudo docker image prune -f -a --filter "until=24h" || true
            
            echo "✅ Deploy Backend GCP Successfully"
