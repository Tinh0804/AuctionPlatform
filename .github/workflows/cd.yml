name: CD Pipeline

on:
  workflow_run:
    workflows: [CI Pipeline]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tested backend image tag (40-character Git SHA)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gcp-production
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy backend stack to GCP VM
    if: >-
      vars.GCP_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
    steps:
      - name: Validate immutable image tag
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "DEPLOY_SHA must be a full 40-character Git SHA" >&2
            exit 1
          }

      - name: Checkout the exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.GCP_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/gcp_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/gcp_deploy" "$HOME/.ssh/known_hosts"

      - name: Package deployment files
        run: tar -czf "$RUNNER_TEMP/auction-deploy.tgz" deploy Backend/database.sql

      - name: Copy release bundle to VM
        run: |
          scp -i "$HOME/.ssh/gcp_deploy" \
            -P "${{ secrets.GCP_SSH_PORT || '22' }}" \
            "$RUNNER_TEMP/auction-deploy.tgz" \
            "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}:/tmp/auction-deploy-${DEPLOY_SHA}.tgz"

      - name: Backup, deploy, health-check and activate release
        run: |
          ssh -i "$HOME/.ssh/gcp_deploy" \
            -p "${{ secrets.GCP_SSH_PORT || '22' }}" \
            "${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_IP }}" \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'REMOTE'
          set -Eeuo pipefail
          release_dir="/srv/auction/releases/$DEPLOY_SHA"
          archive="/tmp/auction-deploy-$DEPLOY_SHA.tgz"

          sudo mkdir -p "$release_dir"
          sudo tar --no-same-owner -xzf "$archive" -C "$release_dir"
          sudo DEPLOY_HOME=/srv/auction \
            APP_ENV_FILE=/srv/auction/.env \
            bash "$release_dir/deploy/scripts/deploy.sh" "$DEPLOY_SHA"
          sudo ln -sfn "$release_dir" /srv/auction/current
          rm -f "$archive"
          REMOTE
