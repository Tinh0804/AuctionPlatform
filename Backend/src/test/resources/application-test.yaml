spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    url: jdbc:h2:mem:auction;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: false
  cache:
    type: none
  data:
    redis:
      repositories:
        enabled: false

app:
  seed:
    enabled: false
  firebase:
    enabled: false
  redis:
    listener-enabled: false

jwt:
  signerKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

vnpay:
  tmn-code: test
  hash-secret: test
  api-url: http://localhost/vnpay
  return-url: http://localhost/return

momo:
  partner-code: test
  access-key: test
  secret-key: test
  api-url: http://localhost/momo
  return-url: http://localhost/return
  notify-url: http://localhost/notify
